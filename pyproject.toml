[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "grayhaired-desktop"
version = "0.1.0"
description = "Desktop Linux wrapper for GrayHaired Desktop using PySide6 QtWebEngine."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "GrayHaired Desktop Maintainers" }]
keywords = ["grayhaired", "desktop", "pyside6", "qtwebengine", "linux"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Topic :: Desktop Environment",
]
dependencies = [
  "PySide6>=6.7",
  "PySide6-Addons>=6.7",
]

[project.urls]
Homepage = "https://grayhaired.tech/desktop-c/"

[project.scripts]
grayhaired-desktop = "grayhaired_desktop.main:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
grayhaired_desktop = ["resources/*.svg"]

[tool.pytest.ini_options]
pythonpath = ["src"]
